<div class="admin-login-page">
  <div class="login-card">

    <div class="login-header">
      <div class="logo-icon">
        <i class="fa-solid fa-table-cells"></i>
      </div>
      <h1 class="logo-title">WebMart</h1>
      <p class="logo-subtitle">ADMIN PANEL</p>
    </div>

    <h2 class="card-title">Welcome back</h2>
    <p class="card-subtitle">Sign in to access the admin dashboard</p>

    <form [formGroup]="signinForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>EMAIL ADDRESS</label>
        <input
          type="email"
          formControlName="email"
          placeholder="admin@webmart.com"
          [class.input-error]="signinForm.get('email')?.touched && signinForm.get('email')?.invalid"
        />
        <span class="error-msg" *ngIf="signinForm.get('email')?.touched && signinForm.get('email')?.invalid">
          Please enter a valid email.
        </span>
      </div>

      <div class="form-group">
        <label>PASSWORD</label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
          [class.input-error]="signinForm.get('password')?.touched && signinForm.get('password')?.invalid"
        />
        <span class="error-msg" *ngIf="signinForm.get('password')?.touched && signinForm.get('password')?.invalid">
          Password is required (min 6 characters).
        </span>
      </div>

      <div class="alert-error" *ngIf="errorMsg">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ errorMsg }}
      </div>

      <button class="submit-btn" type="submit" [disabled]="loading">
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">
          <i class="fa-solid fa-spinner fa-spin"></i> Signing in...
        </span>
      </button>

    </form>

  </div>
</div>
