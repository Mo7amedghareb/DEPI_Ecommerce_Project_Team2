<header class="site-header bg-white">
  <div class="container-fluid px-4">
    <div class="d-flex align-items-center justify-content-between header-inner">

      <!-- Logo -->
      <a routerLink="/" class="brand text-decoration-none fw-bold">
        WebMart
      </a>

      <!-- Links -->
      <nav class="nav-links d-none d-lg-flex align-items-center gap-4">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link-custom"
        >
          Home
        </a>

        <a routerLink="/men" routerLinkActive="active" class="nav-link-custom">
          Men
        </a>

        <a routerLink="/women" routerLinkActive="active" class="nav-link-custom">
          Women
        </a>

        <a routerLink="/accessories" routerLinkActive="active" class="nav-link-custom">
          Accessories
        </a>
      </nav>

      <!-- Actions -->
      <div class="header-actions d-flex align-items-center gap-3">

        <!-- Search -->
        <div class="search-box d-none d-md-flex align-items-center">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input
            type="search"
            class="form-control border-0 shadow-none"
            placeholder="Search curated items..."
          />
        </div>

        <!-- Cart -->
        <button class="icon-btn cart-btn" type="button" aria-label="Cart">
          <i class="fa-solid fa-cart-shopping"></i>
        </button>

        <!-- Wishlist -->
        <button class="icon-btn wishlist-btn" type="button" aria-label="Wishlist">
          <i class="fa-solid fa-heart"></i>
        </button>

        <!-- Profile -->
        <button class="profile-btn" type="button" aria-label="Profile">
          <span>☰</span>
        </button>
      </div>
    </div>
  </div>
</header>
